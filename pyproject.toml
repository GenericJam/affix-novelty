[project]
name = "affix-novelty"
version = "0.1.0"
description = "Distributional study of when affixed words lose compositional meaning"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear,
# SIM simplify, C4 comprehensions, RUF ruff-specific. Catches the common
# anti-patterns (unused vars, mutable defaults, redundant idioms) the way
# mob's credo/ex_slop does for Elixir.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E741",                      # single-letter math var names (a, b, l) are clear here
    "RUF001", "RUF002", "RUF003",  # non-Latin script in strings is real data (Turkish, Arabic)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
